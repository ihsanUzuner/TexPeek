name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -ne "v$v") { throw "Tag ${{ github.ref_name }} does not match VERSION ($v)" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      # MSVC, CMake and Git come with the runner image; DirectXTex, Dear ImGui and OpenEXR are fetched by CMake.
      - name: Build (zip + Setup.exe)
        shell: cmd
        run: build-release.bat
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/TexPeek-Setup-*.exe
            release/TexPeek-*-portable.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Keep artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release
          if-no-files-found: error
          path: |
            release/TexPeek-Setup-*.exe
            release/TexPeek-*-portable.zip
